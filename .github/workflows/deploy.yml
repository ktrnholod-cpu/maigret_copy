name: OWASP ZAP Scan Workflow
on:
  push:
    branches: [ "main" ]
    workflow_dispatch:

jobs:
  zap-scan: 
    runs-on: ubuntu-latest
    name: Scan the web application
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
  
      - name: OWASP ZAP Scan
        uses: zaproxy/action-baseline@v0.11.0
        with:
          target: 'http://localhost:8080'
